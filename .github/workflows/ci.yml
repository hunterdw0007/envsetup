name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to a PR replaces its run still in progress. Pushes to main all finish,
# since the release job runs there.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  shell-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Pinned and verified, so a new release (or the runner image's copy) can't change
      # what passes. To bump: new version and sha256 here, and in AGENTS.md's commands.
      - name: Install shellcheck and shfmt (pinned)
        run: |
          mkdir "$RUNNER_TEMP/lint" && cd "$RUNNER_TEMP/lint"
          curl -fsSLo shellcheck.tar.xz https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
          curl -fsSLo shfmt https://github.com/mvdan/sh/releases/download/v3.14.1/shfmt_v3.14.1_linux_amd64
          sha256sum -c <<'EOF'
          8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  shellcheck.tar.xz
          76e77641faa025814b77f153b29796b8e6fa2fca03e0c76a691608b86c7ea7bf  shfmt
          EOF
          tar -xJf shellcheck.tar.xz --strip-components=1 shellcheck-v0.11.0/shellcheck
          chmod +x shfmt
          echo "$PWD" >>"$GITHUB_PATH"

      # Also fails on syntax errors, so no separate bash -n.
      - name: shellcheck
        run: find . -name '*.sh' -not -path './.git/*' -print0 | xargs -0 shellcheck

      # -i 0: tabs, and an explicit flag also makes shfmt ignore any .editorconfig.
      - name: shfmt
        run: shfmt -d -i 0 .

      # .github/scripts/release.sh, the only code that pushes to main, run the way the
      # release job below runs it, against a scratch origin. See tests/release.sh.
      - uses: ./.github/actions/commitizen

      - name: tests/release.sh
        run: tests/release.sh

  smoke:
    # Runs the real tool on a bare Ubuntu box (install.sh -> setup.sh -> real bash/zsh);
    # only gum's UI, package installs and vendor downloads are stubbed. See tests/smoke.sh.
    runs-on: ubuntu-24.04
    timeout-minutes: 20 # a cache miss fetches from Ubuntu's archive; a hit takes seconds
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Ubuntu's archive is slow from CI often enough (minutes for a few packages, or a
      # stall), so the smoke test runs offline. What it installs with real apt (git for
      # install.sh, zsh and jq) and apt's lists are fetched once per ubuntu:24.04 image and
      # cached; offline, install.sh's apt-get update fails and it installs git from them.
      - name: ubuntu:24.04's digest
        id: image
        run: |
          docker pull -q ubuntu:24.04 >/dev/null
          echo "digest=$(docker inspect --format '{{index .RepoDigests 0}}' ubuntu:24.04 | cut -d@ -f2)" >>"$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: apt
        with:
          path: ${{ runner.temp }}/smoke-apt
          key: smoke-apt-${{ steps.image.outputs.digest }}-git-zsh-jq-norecommends

      - name: Fetch the smoke test's packages
        if: steps.apt.outputs.cache-hit != 'true'
        timeout-minutes: 15
        run: >-
          docker run --rm -v "$RUNNER_TEMP/smoke-apt:/out" ubuntu:24.04 bash -euc
          'rm /etc/apt/apt.conf.d/docker-clean; apt-get update -q; apt-get install -y -q --no-install-recommends --download-only git zsh jq;
          mkdir -p /out/lists /out/archives; cp -a /var/lib/apt/lists/. /out/lists/;
          cp /var/cache/apt/archives/*.deb /out/archives/; chmod -R a+rX /out'

      - name: smoke test (ubuntu:24.04, offline)
        run: >-
          docker run --rm -t --network none -e SMOKE_APT_CACHE=/apt-cache
          -v "$RUNNER_TEMP/smoke-apt:/apt-cache:ro" -v "$PWD:/src:ro" ubuntu:24.04 bash /src/tests/smoke.sh

  release:
    # Every push to main whose commits call for a version bump (feat, fix, "!", ...) is
    # released once the checks above pass: a "bump:" commit on main adds its CHANGELOG.md
    # entry and is tagged vX.Y.Z, and a GitHub release is published. See
    # .github/scripts/release.sh.
    needs: [shell-checks, smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write # push the bump commit and tag, create the release
    concurrency:
      # One at a time, so two quick merges can't both claim a version. A run still waiting
      # is replaced by a newer one, which releases both merges' commits.
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # every commit and tag: the bump is worked out from the commits since the last tag
          # No token left in .git/config: commitizen runs in the next steps, and only the
          # publish step, which doesn't run it, gets a token. Defense in depth, not a
          # boundary (steps share the runner); the control is commitizen's hash lock.
          persist-credentials: false

      - uses: ./.github/actions/commitizen

      - name: Bump (commit and tag, locally)
        run: .github/scripts/release.sh bump

      - name: Push and release
        env:
          # GITHUB_TOKEN can push while main has no branch protection; once it does, set
          # a RELEASE_TOKEN secret that's allowed to bypass it.
          PUSH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/release.sh publish
