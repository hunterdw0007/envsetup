name: distros

# Weekly and on demand (Actions tab > distros > Run workflow): tries envsetup on many
# distros with real package installs, which takes too long for every push. See
# tests/distros/run.sh. The report lands in the run summary and as an artifact; a failed
# weekly run opens an issue (or comments on the open one).
on:
  schedule:
    # Thursdays, away from Monday's bump-versions run and the distros run it starts.
    - cron: "0 6 * * 4"
  workflow_dispatch:
    inputs:
      images:
        description: Container images, space-separated (empty runs the default list)
        required: false
        default: ""
      skip:
        description: Packages/installers to leave out, as in ENVSETUP_SKIP
        required: false
        default: ""

permissions:
  contents: read

jobs:
  distros:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The containers mount this checkout and run vendor installers: keep the
          # token out of it. Every clone in the tests is local.
          persist-credentials: false

      - name: Run tests/distros/run.sh
        env:
          IMAGES: ${{ inputs.images }}
          DISTROS_SKIP: ${{ inputs.skip }}
          DISTROS_OUT: ${{ runner.temp }}/distros-report
          JOBS: "4"
        run: |
          # Image-name characters only: $IMAGES is split into words, unquoted, below.
          re='^[a-z0-9./:_ -]*$'
          [[ $IMAGES =~ $re ]] || { echo "::error::images may only contain a-z 0-9 . / : _ - and spaces"; exit 1; }
          # shellcheck disable=SC2086 # split on purpose: one image per word
          tests/distros/run.sh $IMAGES

      - name: Report
        if: always()
        run: cat "$RUNNER_TEMP/distros-report/report.md" >>"$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: distros-report
          path: ${{ runner.temp }}/distros-report

  report-failure:
    needs: distros
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write # this job only, and it runs no repo code
    steps:
      - name: Open or comment on the issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TITLE: "distros: weekly run failed"
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          n=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number,title \
            --jq "map(select(.title == env.TITLE))[0].number // empty")
          if [[ -n $n ]]; then
            gh issue comment "$n" --body "Failed again: $RUN"
          else
            gh issue create --title "$TITLE" --body "The weekly distros run failed: $RUN (report in its summary and artifact)."
          fi
