name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  COMMITIZEN_VERSION: "4.19.2" # keep in step with commits.yml

jobs:
  shell-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: bash -n (syntax check)
        run: find . -name '*.sh' -not -path './.git/*' -print0 | xargs -0 -n1 bash -n

      # macOS's /bin/bash: install.sh and the start of setup.sh run under it, and the
      # login shell sources shell/ (AGENTS.md).
      - name: bash 3.2 (macOS) checks
        run: |
          docker run --rm -i -v "$PWD:/src:ro" -w /src bash:3.2 bash <<'EOF'
          for f in install.sh setup.sh lib/*.sh shell/init.sh shell/shared/*.sh shell/profiles/*/*.sh; do bash -n "$f" || exit 1; done
          ./setup.sh --help >/dev/null || exit 1
          # Past option parsing, up to the re-exec: this image has no newer bash, so it
          # has to say so and exit 1.
          out=$(./setup.sh 2>&1); rc=$?
          [[ $rc == 1 && $out == *"needs bash 4 or newer"* ]] || { echo "rc=$rc: $out"; exit 1; }
          EOF

      - name: shellcheck
        run: find . -name '*.sh' -not -path './.git/*' -print0 | xargs -0 shellcheck

  smoke:
    # Runs the real tool on a bare Ubuntu box (install.sh -> setup.sh -> real bash/zsh);
    # only gum's UI, package installs and vendor downloads are stubbed. See tests/smoke.sh.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: smoke test (ubuntu:24.04)
        run: docker run --rm -t -v "$PWD:/src:ro" ubuntu:24.04 bash /src/tests/smoke.sh

  release:
    # Every push to main whose commits call for a version bump (feat, fix, "!", ...) is
    # released once the checks above pass: a "bump:" commit on main adds its CHANGELOG.md
    # entry and is tagged vX.Y.Z, and a GitHub release is published. See
    # .github/scripts/release.sh.
    needs: [shell-checks, smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # push the bump commit and tag, create the release
    concurrency:
      # One at a time, so two quick merges can't both claim a version. A run still waiting
      # is replaced by a newer one, which releases both merges' commits.
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # every commit and tag: the bump is worked out from the commits since the last tag
          # Pushes the bump commit to main. GITHUB_TOKEN can while main has no branch
          # protection; once it does, set a RELEASE_TOKEN secret that's allowed to bypass it.
          token: ${{ secrets.RELEASE_TOKEN || github.token }}

      - name: Install commitizen
        run: pipx install "commitizen==$COMMITIZEN_VERSION"

      - name: Bump, tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/release.sh
