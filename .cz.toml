# This file configures commitizen (https://commitizen-tools.github.io/commitizen/).
# commitizen checks commit messages against Conventional Commits.
# It also picks the next version and writes its CHANGELOG.md entry from the messages.
# CI uses it to release main (.github/scripts/release.sh).
# See "Releases" in AGENTS.md.
[tool.commitizen]
name = "cz_conventional_commits"
# The newest vX.Y.Z tag sets the current version.
# Each release is a "bump:" commit on main that adds the release's CHANGELOG.md entry.
# The new version's tag marks that commit.
version_provider = "scm"
version_scheme = "semver2"
tag_format = "v$version"
annotated_tag = true
update_changelog_on_bump = true
# On 0.x, a breaking change raises the minor version, not the major version.
# A move to 1.0.0 takes its own PR, which sets this to false.
# That PR is a breaking change itself (see AGENTS.md).
major_version_zero = true
# The entries follow commitizen's default changelog.
# They add one "Breaking changes" section for every kind of breaking commit.
# The default spreads those commits across sections or does not mark them.
template = ".github/changelog.md.j2"
change_type_map = { feat = "Features", fix = "Fixes", perf = "Performance", refactor = "Refactoring" }
change_type_order = ["BREAKING CHANGE", "Features", "Fixes", "Performance", "Refactoring"]
