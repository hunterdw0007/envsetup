name: commits

# The release job picks versions and writes release notes from commit messages.
# See "Releases" in AGENTS.md.
# So every commit in a PR must be a Conventional Commit.
# The PR title must be one too, because it becomes the commit message after a squash merge.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  conventional-commits:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the PR's commits and its base

      - uses: ./.github/actions/commitizen

      - name: PR title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: cz check --message "$TITLE"

      - name: Commits
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: cz check --rev-range "$BASE..$HEAD"
