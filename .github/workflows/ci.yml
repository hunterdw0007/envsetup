name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to a PR cancels the PR's run that is still in progress.
# Every push to main runs to the end, because the release job runs there.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  shell-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # This step pins and checks both tools.
      # So a new release, or the copy on the runner image, cannot change what passes.
      # To update a tool, change its version and sha256 here and in AGENTS.md.
      - name: Install shellcheck and shfmt (pinned)
        run: |
          mkdir "$RUNNER_TEMP/lint" && cd "$RUNNER_TEMP/lint"
          curl -fsSLo shellcheck.tar.xz https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
          curl -fsSLo shfmt https://github.com/mvdan/sh/releases/download/v3.14.1/shfmt_v3.14.1_linux_amd64
          sha256sum -c <<'EOF'
          8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  shellcheck.tar.xz
          76e77641faa025814b77f153b29796b8e6fa2fca03e0c76a691608b86c7ea7bf  shfmt
          EOF
          tar -xJf shellcheck.tar.xz --strip-components=1 shellcheck-v0.11.0/shellcheck
          chmod +x shfmt
          echo "$PWD" >>"$GITHUB_PATH"

      # shellcheck also fails on syntax errors, so CI does not run bash -n.
      - name: shellcheck
        run: find . -name '*.sh' -not -path './.git/*' -print0 | xargs -0 shellcheck

      # -i 0 means tabs.
      # Any explicit flag also makes shfmt ignore .editorconfig.
      - name: shfmt
        run: shfmt -d -i 0 .

      # .github/scripts/release.sh is the only code that pushes to main.
      # This step runs it the same way as the release job below, against a local test remote.
      # See tests/release.sh.
      - uses: ./.github/actions/commitizen

      - name: tests/release.sh
        run: tests/release.sh

  smoke:
    # This job runs the real tool on a bare Ubuntu container: install.sh, then setup.sh, then real bash and zsh.
    # Only gum's menus, package installs and vendor downloads are fakes.
    # See tests/smoke.sh.
    runs-on: ubuntu-24.04
    timeout-minutes: 20 # a cache miss fetches from Ubuntu's archive; a hit takes seconds
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Ubuntu's package servers are often slow from CI.
      # A few packages can take minutes, or the download can stop.
      # So the smoke test runs offline.
      # The test installs git (for install.sh), zsh and jq with real apt.
      # CI downloads those packages and apt's lists once for each ubuntu:24.04 image and caches them.
      # The test installs git with the command that install.sh shows.
      # Offline, the cached lists stand in for that command's apt-get update.
      - name: ubuntu:24.04's digest
        id: image
        run: |
          docker pull -q ubuntu:24.04 >/dev/null
          echo "digest=$(docker inspect --format '{{index .RepoDigests 0}}' ubuntu:24.04 | cut -d@ -f2)" >>"$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: apt
        with:
          path: ${{ runner.temp }}/smoke-apt
          key: smoke-apt-${{ steps.image.outputs.digest }}-git-zsh-jq-norecommends

      - name: Fetch the smoke test's packages
        if: steps.apt.outputs.cache-hit != 'true'
        timeout-minutes: 15
        run: >-
          docker run --rm -v "$RUNNER_TEMP/smoke-apt:/out" ubuntu:24.04 bash -euc
          'rm /etc/apt/apt.conf.d/docker-clean; apt-get update -q; apt-get install -y -q --no-install-recommends --download-only git zsh jq;
          mkdir -p /out/lists /out/archives; cp -a /var/lib/apt/lists/. /out/lists/;
          cp /var/cache/apt/archives/*.deb /out/archives/; chmod -R a+rX /out'

      - name: smoke test (ubuntu:24.04, offline)
        run: >-
          docker run --rm -t --network none -e SMOKE_APT_CACHE=/apt-cache
          -v "$RUNNER_TEMP/smoke-apt:/apt-cache:ro" -v "$PWD:/src:ro" ubuntu:24.04 bash /src/tests/smoke.sh

  release:
    # This job releases each push to main whose commits need a new version (feat, fix, "!", ...).
    # It runs after the checks above pass.
    # A "bump:" commit on main adds the CHANGELOG.md entry.
    # A vX.Y.Z tag marks that commit, and the job publishes a GitHub release.
    # See .github/scripts/release.sh.
    needs: [shell-checks, smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write # push the bump commit and tag, create the release
    concurrency:
      # Only one release runs at a time, so two quick merges cannot both take a version.
      # A newer run replaces a run that is still waiting.
      # The newer run releases the commits of both merges.
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # every commit and tag: the bump is worked out from the commits since the last tag
          # .git/config keeps no token, because commitizen runs in the next steps.
          # Only the publish step gets a token, and that step does not run commitizen.
          # This adds a layer of protection, but the steps share the runner.
          # The main protection is commitizen's hash lock.
          persist-credentials: false

      - uses: ./.github/actions/commitizen

      - name: Bump (commit and tag, locally)
        run: .github/scripts/release.sh bump

      - name: Push and release
        env:
          # GITHUB_TOKEN can push while main has no branch protection.
          # If main gets protection, set a RELEASE_TOKEN secret that can bypass it.
          PUSH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/release.sh publish
