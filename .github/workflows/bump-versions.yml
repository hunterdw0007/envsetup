name: bump-versions

# This workflow runs every week.
# It looks up the newest release of every tool in installers/versions.txt.
# It opens one PR with the new versions and checksums, or updates that PR.
# See "Installer scripts" in AGENTS.md.
# To run it now, open Actions > bump-versions > Run workflow.
on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read # the push and the PR use RELEASE_TOKEN, below

concurrency:
  group: bump-versions
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          # .git/config holds no token while the lookups run.
          # Only the last step gets a token.
          persist-credentials: false

      - name: Look up the newest versions
        run: |
          .github/scripts/bump-versions.sh >"$RUNNER_TEMP/changes.md"
          tee -a "$GITHUB_STEP_SUMMARY" <"$RUNNER_TEMP/changes.md"

      - name: Open or update the PR
        env:
          # This step does not use GITHUB_TOKEN.
          # A push or PR made with GITHUB_TOKEN starts no workflows, so the PR would get no CI.
          # The token needs write access to Contents, Pull requests and Actions.
          PUSH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: .github/scripts/bump-pr.sh "$RUNNER_TEMP/changes.md"
